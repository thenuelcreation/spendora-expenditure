services:
  - type: web
    name: spendora-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm ci && npm run db:generate
    startCommand: npm run db:deploy && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: spendora-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true

databases:
  - name: spendora-db
    databaseName: spendora
    user: spendora
    plan: free
