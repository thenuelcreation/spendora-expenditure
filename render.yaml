services:
  - type: web
    name: spendora-api
    runtime: go
    plan: free
    rootDir: go-api
    buildCommand: go build -o bin/spendora ./cmd/api
    startCommand: ./bin/spendora
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: spendora-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true

databases:
  - name: spendora-db
    databaseName: spendora
    user: spendora
    plan: free
