services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: spendora
      POSTGRES_PASSWORD: spendora
      POSTGRES_DB: spendora
    ports:
      - "5432:5432"
    volumes:
      - spendora-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spendora"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  spendora-data:
